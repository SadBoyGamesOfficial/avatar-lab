const renderers={telegram,vk,youtube,tiktok,instagram,steam,xapp};
function fitPreview(){
 const sim=$('sim'),stage=$('stage');
 if(!sim.classList.contains('phone')){sim.style.cssText='';return}
 const w=stage.clientWidth,h=stage.clientHeight;
 const scale=innerWidth<=800?w/390:Math.min(w/390,h/760);
 if(scale<=0)return;
 sim.style.width='390px';sim.style.height=(h/scale)+'px';sim.style.transform=`translateX(-50%) scale(${scale})`;
}
function render(){
 const a=AVATARS[state.i],p=PLATFORMS[state.p];
 $('open-gallery').textContent=`Вариант ${state.i+1}`;
 $('platform-name').textContent=p[1];$('view-mode').value=state.view;
 $('theme-toggle').innerHTML=I(state.dark?'sun':'moon','sm');$('theme-toggle').setAttribute('aria-pressed',String(state.dark));
 document.querySelector('.shell').classList.toggle('image-mode',state.images);
 $('platform-switcher').hidden=state.images;$('view-mode').hidden=state.images;
 $('image-toggle').textContent=state.images?'Показать в соцсетях':'Просмотр оригинала';$('image-toggle').setAttribute('aria-pressed',String(state.images));
 $('sim').className=state.images?`sim original ${state.dark?'dark':''}`:`sim ${p[0]} ${isPhone()?'phone':'desktop'} ${state.dark?'dark':''}`;
 $('sim').innerHTML=state.images?`<div class="original-view"><img src="${a.src}" alt="Вариант ${AVATARS.indexOf(a)+1}" draggable="false"></div>`:renderers[p[0]]();
 $('sim').setAttribute('aria-label',state.images?`Вариант ${state.i+1}`:p[1]);$('stage').scrollLeft=0;$('gallery').hidden=!state.gallery;$('gallery-toggle').setAttribute('aria-expanded',String(state.gallery));
 if(state.gallery)renderGallery();fitPreview();persist();
}
function renderGallery(){$('thumb-grid').innerHTML=AVATARS.map((a,i)=>`<button class="thumb" data-index="${i}" aria-current="${i===state.i}" aria-label="Вариант ${i+1}">${avatar(68,'',a)}<span>Вариант ${i+1}</span></button>`).join('')}
function moveAvatar(d){state.i=mod(state.i+d,AVATARS.length);render()}
function movePlatform(d){state.p=mod(state.p+d,PLATFORMS.length);render()}
$('avatar-prev').onclick=()=>moveAvatar(-1);$('avatar-next').onclick=()=>moveAvatar(1);$('platform-prev').onclick=()=>movePlatform(-1);$('platform-next').onclick=()=>movePlatform(1);
$('view-mode').onchange=e=>{state.view=e.target.value;render()};$('theme-toggle').onclick=()=>{state.dark=!state.dark;render()};
$('image-toggle').onclick=()=>{state.images=!state.images;render()};
$('gallery-toggle').onclick=()=>{state.gallery=!state.gallery;render()};$('open-gallery').onclick=()=>{state.gallery=true;render();$('gallery').scrollIntoView({block:'nearest',behavior:'smooth'})};$('gallery-close').onclick=()=>{state.gallery=false;render()};
$('thumb-grid').onclick=e=>{const b=e.target.closest('[data-index]');if(!b)return;state.i=Number(b.dataset.index);render();$('stage').scrollIntoView({block:'nearest',behavior:'smooth'})};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const handlers={ArrowLeft:()=>moveAvatar(-1),ArrowRight:()=>moveAvatar(1),ArrowUp:()=>movePlatform(-1),ArrowDown:()=>movePlatform(1)};if(handlers[e.key]){e.preventDefault();handlers[e.key]()}});

new ResizeObserver(fitPreview).observe($('stage'));addEventListener('resize',fitPreview);render();
</script>
